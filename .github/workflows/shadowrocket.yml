name: Build Shadowrocket subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_shadowrocket.py"
      - ".github/workflows/shadowrocket.yml"

permissions:
  contents: write

concurrency:
  group: shadowrocket-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and triple-check nodes
        run: python scripts/build_shadowrocket.py
      - name: Commit subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrocket/px.txt shadowrocket/px-raw.txt shadowrocket/report.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh Shadowrocket subscription"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
